<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Meme-Ball</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Pretendard', 'Apple SD Gothic Neo', -apple-system, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #121212;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #app-container {
            width: 100%;
            max-width: 480px;
            height: 100%;
            max-height: 920px;
            background-color: #ffffff;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
            overflow: hidden;
        }

        .select-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #ffffff;
            z-index: 100;
            display: flex;
            flex-direction: column;
        }

        .select-half {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px;
            position: relative;
            background: #ffffff;
        }

        .select-half.top {
            border-bottom: 2px dashed #e0e0e0;
            background: #fafafa;
        }

        .nav-btn {
            background: #f0f0f0;
            border: 2px solid #ccc;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s;
            color: #333;
        }

        .nav-btn:active {
            transform: scale(0.9);
        }

        .card-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            text-align: center;
            flex: 1;
        }

        .ball-preview-wrapper {
            position: relative;
            cursor: pointer;
        }

        .ball-preview-wrapper::after {
            content: '🔍 클릭하여 상세정보';
            position: absolute;
            bottom: -18px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 10px;
            color: #888;
            white-space: nowrap;
            font-weight: 600;
        }

        .ball-preview {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            background-size: cover;
            background-position: center;
            overflow: hidden;
        }

        .ball-preview:hover {
            transform: scale(1.08);
        }

        .ball-preview.shake {
            animation: bounceShake 0.4s cubic-bezier(0.36, 0.07, 0.19, 0.97);
        }

        @keyframes bounceShake {
            0% { transform: scale(1) rotate(0deg); }
            20% { transform: scale(1.2) rotate(-10deg); }
            40% { transform: scale(0.9) rotate(8deg); }
            60% { transform: scale(1.1) rotate(-5deg); }
            80% { transform: scale(0.95) rotate(2deg); }
            100% { transform: scale(1) rotate(0deg); }
        }

        .ball-title {
            font-size: 18px;
            font-weight: 800;
            color: #222;
            margin-top: 14px;
        }

        .stats-box {
            font-size: 12px;
            color: #555;
            line-height: 1.4;
            background: rgba(0,0,0,0.04);
            padding: 6px 14px;
            border-radius: 12px;
            width: 180px;
        }

        .join-btn {
            padding: 6px 16px;
            font-size: 13px;
            font-weight: 800;
            border-radius: 20px;
            border: 2px solid #adb5bd;
            background: #e9ecef;
            color: #495057;
            cursor: pointer;
            transition: all 0.2s;
        }

        .join-btn.joined {
            background: #ff3b30;
            color: #ffffff;
            border-color: #ff3b30;
            box-shadow: 0 4px 10px rgba(255, 59, 48, 0.3);
        }

        .center-divider {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 101;
        }

        .start-btn {
            background: #111;
            color: #fff;
            border: 3px solid #000;
            padding: 10px 32px;
            font-size: 20px;
            font-weight: 900;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 6px 16px rgba(0,0,0,0.3);
            letter-spacing: 2px;
            transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
        }

        .start-btn:hover {
            transform: translateY(-4px) scale(1.05);
            background: #ff3b30;
            border-color: #ff3b30;
            box-shadow: 0 10px 20px rgba(255, 59, 48, 0.4);
        }

        .start-btn:active {
            transform: translateY(-1px) scale(0.98);
        }

        .info-modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(4px);
            z-index: 300;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
            padding: 20px;
        }

        .info-modal-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .info-card {
            width: 100%;
            max-width: 360px;
            background: #ffffff;
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.25);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            position: relative;
            animation: modalUp 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes modalUp {
            from { transform: translateY(20px) scale(0.95); opacity: 0; }
            to { transform: translateY(0) scale(1); opacity: 1; }
        }

        .modal-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .modal-ball-img {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background-size: cover;
            background-position: center;
            box-shadow: 0 6px 14px rgba(0,0,0,0.15);
        }

        .modal-ball-title {
            font-size: 22px;
            font-weight: 900;
            color: #111;
        }

        .modal-stats-grid {
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            background: #f8f9fa;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid #e9ecef;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 12px;
            color: #666;
        }

        .stat-item strong {
            font-size: 15px;
            color: #222;
            margin-top: 2px;
        }

        .modal-skill-box {
            width: 100%;
            background: #fff0f0;
            border: 1px solid #ffc9c9;
            border-radius: 12px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .skill-title {
            font-size: 13px;
            font-weight: 800;
            color: #e03131;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .skill-desc {
            font-size: 12px;
            color: #495057;
            line-height: 1.5;
            word-break: keep-all;
        }

        .modal-close-btn {
            width: 100%;
            padding: 12px;
            background: #212529;
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            transition: background 0.2s;
        }

        .modal-close-btn:active {
            background: #000000;
        }

        .game-screen {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 12px;
            background: #ffffff;
            position: relative;
        }

        .status-panel {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            padding: 8px 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.03);
            z-index: 10;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .profile-info {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .ball-icon-mini {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background-size: cover;
            background-position: center;
        }

        .name-text {
            font-weight: 800;
            font-size: 15px;
            color: #212529;
        }

        .side-tag {
            font-size: 10px;
            font-weight: 800;
            padding: 2px 6px;
            border-radius: 4px;
            background: #dee2e6;
            color: #495057;
        }

        .side-tag.player {
            background: #ffe3e3;
            color: #e03131;
        }

        .hp-text {
            font-weight: 800;
            font-size: 13px;
            color: #212529;
        }

        .bar-container {
            width: 100%;
            height: 12px;
            background: #e9ecef;
            border-radius: 6px;
            overflow: hidden;
            position: relative;
            border: 1px solid #ced4da;
        }

        .hp-bar-fill {
            height: 100%;
            background: #ffd43b;
            width: 100%;
            transition: width 0.15s ease-out;
        }

        .cool-container {
            width: 100%;
            height: 6px;
            background: #e9ecef;
            border-radius: 3px;
            overflow: hidden;
            margin-top: 1px;
        }

        .cool-bar-fill {
            height: 100%;
            background: #4dabf7;
            width: 0%;
            transition: width 0.05s linear;
        }

        .arena-container {
            flex: 1;
            margin: 8px 0;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 0;
        }

        canvas {
            width: 100%;
            height: 100%;
            background: #ffffff;
            border: 3px solid #212529;
            border-radius: 12px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.05);
            display: block;
        }

        .action-area {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .attack-btn {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            font-weight: 900;
            border: none;
            border-radius: 12px;
            background: #e9ecef;
            color: #adb5bd;
            cursor: not-allowed;
            transition: all 0.2s;
            letter-spacing: 1px;
        }

        .attack-btn.ready {
            background: #ff3b30;
            color: #ffffff;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(255, 59, 48, 0.4);
        }

        .attack-btn.ready:active {
            transform: scale(0.98);
        }

        .game-over-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 200;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            color: #fff;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s;
        }

        .game-over-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .winner-title {
            font-size: 28px;
            font-weight: 900;
            text-align: center;
        }

        .restart-btn {
            padding: 10px 28px;
            font-size: 16px;
            font-weight: bold;
            background: #fff;
            color: #000;
            border: none;
            border-radius: 25px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div id="app-container">
    <!-- 공 선택 화면 -->
    <div id="selectScreen" class="select-screen">
        <div class="select-half top">
            <button class="nav-btn" onclick="changeSelection('p1', -1)">&lt;</button>
            <div class="card-content">
                <button id="p1-join-btn" class="join-btn" onclick="toggleJoin('p1')">참여 (AI)</button>
                <div class="ball-preview-wrapper" onclick="openInfoModal('p1')">
                    <div id="p1-preview" class="ball-preview"></div>
                </div>
                <div id="p1-name" class="ball-title">Name</div>
                <div id="p1-stats" class="stats-box"></div>
            </div>
            <button class="nav-btn" onclick="changeSelection('p1', 1)">&gt;</button>
        </div>

        <div class="center-divider">
            <button class="start-btn" onclick="startGame()">START</button>
        </div>

        <div class="select-half">
            <button class="nav-btn" onclick="changeSelection('p2', -1)">&lt;</button>
            <div class="card-content">
                <button id="p2-join-btn" class="join-btn" onclick="toggleJoin('p2')">참여 (AI)</button>
                <div class="ball-preview-wrapper" onclick="openInfoModal('p2')">
                    <div id="p2-preview" class="ball-preview"></div>
                </div>
                <div id="p2-name" class="ball-title">Name</div>
                <div id="p2-stats" class="stats-box"></div>
            </div>
            <button class="nav-btn" onclick="changeSelection('p2', 1)">&gt;</button>
        </div>
    </div>

    <!-- 공 상세 정보 모달 -->
    <div id="infoModal" class="info-modal-overlay">
        <div class="info-card">
            <div class="modal-header">
                <div id="modalBallImg" class="modal-ball-img"></div>
                <div id="modalBallTitle" class="modal-ball-title">공 이름</div>
            </div>

            <div class="modal-stats-grid">
                <div class="stat-item">최대 체력<strong id="modalHp">400</strong></div>
                <div class="stat-item">이동 속도<strong id="modalSpeed">3.8</strong></div>
                <div class="stat-item">스킬 데미지<strong id="modalAtk">35</strong></div>
                <div class="stat-item">쿨타임<strong id="modalCool">5.0초</strong></div>
            </div>

            <div class="modal-skill-box">
                <div class="skill-title">⚡ 특수 공격 메커니즘</div>
                <div id="modalSkillDesc" class="skill-desc">설명 텍스트</div>
            </div>

            <button class="modal-close-btn" onclick="closeInfoModal()">확인</button>
        </div>
    </div>

    <!-- 게임 화면 -->
    <div class="game-screen">
        <div id="topPanelArea">
            <div class="status-panel" id="panel-top">
                <div class="panel-header">
                    <div class="profile-info">
                        <div id="ui-top-icon" class="ball-icon-mini"></div>
                        <span id="ui-top-name" class="name-text">Top Ball</span>
                        <span id="ui-top-tag" class="side-tag">AI</span>
                    </div>
                    <div id="ui-top-hp-text" class="hp-text">400 / 400</div>
                </div>
                <div class="bar-container">
                    <div id="ui-top-hp-bar" class="hp-bar-fill"></div>
                </div>
                <div class="cool-container">
                    <div id="ui-top-cool-bar" class="cool-bar-fill"></div>
                </div>
            </div>
        </div>

        <div class="arena-container" id="arenaContainer">
            <canvas id="gameCanvas"></canvas>
        </div>

        <div class="action-area">
            <div class="status-panel" id="panel-bottom">
                <div class="panel-header">
                    <div class="profile-info">
                        <div id="ui-bottom-icon" class="ball-icon-mini"></div>
                        <span id="ui-bottom-name" class="name-text">Bottom Ball</span>
                        <span id="ui-bottom-tag" class="side-tag">AI</span>
                    </div>
                    <div id="ui-bottom-hp-text" class="hp-text">400 / 400</div>
                </div>
                <div class="bar-container">
                    <div id="ui-bottom-hp-bar" class="hp-bar-fill"></div>
                </div>
                <div class="cool-container">
                    <div id="ui-bottom-cool-bar" class="cool-bar-fill"></div>
                </div>
            </div>
            <button id="playerAttackBtn" class="attack-btn" onclick="usePlayerSkill()" style="display: none;">ATTACK</button>
        </div>
    </div>

    <div id="gameOverOverlay" class="game-over-overlay">
        <div id="winnerText" class="winner-title">P1 승리!</div>
        <button class="restart-btn" onclick="resetToSelect()">다시 선택하기</button>
    </div>
</div>

<script>
/* 
=================================================================================
 📌 GitHub에서 MP3 효과음 링크 가져와서 적용하는 방법
=================================================================================
 1. GitHub에 'assets' 또는 'sounds' 리포지토리를 만들고 mp3 파일(예: fire.mp3)을 업로드합니다.
 2. 업로드한 mp3 파일 페이지에서 [Download] 버튼에 마우스 우클릭 -> [링크 주소 복사] 클릭.
 3. 복사된 주소가 아래처럼 'raw.githubusercontent.com' 형태로 되어 있는지 확인합니다.
    예시: https://raw.githubusercontent.com/사용자아이디/리포지토리/main/fire.mp3
 4. 아래 SPECIAL_BALLS 항목의 'soundUrl'에 해당 주소를 붙여넣으시면 됩니다!
=================================================================================
*/
 /*
    공격 종류
    1. expolosion
    지정한 위치에서 원형 테두리가 점점 커지며 퍼졌다가 사라지는 폭발 효과
    x, y: 폭발이 일어날 위치 (예: target.x, target.y)
    color: 폭발 색상 (RGBA로 투명도를 주면 자연스럽습니다. 예: "rgba(255, 77, 77, 0.6)")
    radius: 시작 반지름 (기본값 보통 10)
    maxRadius: 최대 커질 반지름 (예: 100)
    duration: 이펙트가 유지될 프레임 수 (예: 30)

    type: "explosion",
                x: target.x,
                y: target.y,
                color: "rgba(255, 77, 77, 0.6)",
                radius: 10,
                maxRadius: 100,
                duration: 30
            
    2. Lightning
    출발점에서 도착점까지 중간 지점이 지그재그로 꺾이는 벼락/전기 효과입니다.
    자신 → 상대방으로 벼락
    x1, y1: 벼락 시작점 (예: caster.x, caster.y)
    x2, y2: 벼락 도착점 (예: target.x, target.y)
    color: 번개 색상 (예: "#ffea00")
    duration: 유지 프레임 수 (예: 20)

    type: "lightning",
                x1: caster.x, y1: caster.y,
                x2: target.x, y2: target.y,
                color: "#ffea00",
                duration: 20

    3. beam
    출발점과 도착점 사이를 잇는 두꺼운 선 형태의 에너지 빔/레이저 효과입니다.
    x1, y1: 레이저 발사 위치
    x2, y2: 레이저 도달 위치
    color: 레이저 색상 (예: "rgba(168, 85, 247, 0.8)")
    width: 레이저 두께 (예: 30)
    duration: 유지 프레임 수 (예: 25)

    type: "beam",
                x1: caster.x, y1: caster.y,
                x2: target.x, y2: target.y,
                color: "rgba(168, 85, 247, 0.8)",
                width: 30,
                duration: 25
    
    4. wave
    폭발과 유사하지만 내부는 비어있고 링 형태로 사방에 넓게 퍼져나가는 충격파 효과입니다.
    (자신을 중심으로 방출)
    x, y: 충격파 중심점 (예: caster.x, caster.y)
    color: 충격파 색상 (예: "#38bdf8")
    radius: 시작 반지름
    maxRadius: 최대 퍼질 범위 (예: 160)
    duration: 유지 프레임 수 (예: 35)

    type: "wave",
                x: caster.x,
                y: caster.y,
                color: "#38bdf8",
                radius: 10,
                maxRadius: 160,
                duration: 35
    
                
    */

const SPECIAL_BALLS = [
    {
        id: "takethatlshit",
        name: "권루트",
        color: "#2db400",
        image: "https://scontent-icn2-1.cdninstagram.com/v/t51.82787-19/782386344_18082780595417872_9181844508404369934_n.jpg?_nc_cat=104&ccb=7-5&_nc_sid=bf7eb4&efg=eyJ2ZW5jb2RlX3RhZyI6InByb2ZpbGVfcGljLnd3dy44NTkuQzMifQ%3D%3D&_nc_ohc=fXaTqkY3hsgQ7kNvwGZvWVY&_nc_oc=AdoXudsLQpQMaxRF8pIG6j2ngAnqdCvFFaedHDqwC_Hh9yOTu6juX_aZgfUIX_d-HCE&_nc_zt=24&_nc_ht=scontent-icn2-1.cdninstagram.com&_nc_gid=KOS2NplhQz2HZZ1iHV2qdg&_nc_ss=7b6a8&oh=00_AQJrZRbtrxkeHK2auF5L-mPsxgCLv47Dto86bWrG-SUHtQ&oe=6AABE478",
        soundUrl: "https://github.com/2thancho2/2than-MP3/raw/50888708f55b487d8b46768d60a01b38afab0a5a/Takel.mp3", // GitHub Raw MP3 URL 적용 위치
        maxHp: 250,
        attackPower: 40,
        cooldown: 5.0,
        speed: 3.8,
        description: "스킬 사용 시 현제 위치 근처에서 폭발 이 일어남",
        onSkillUse: (caster, target, addEffect) => {
            addEffect({
                type: "explosion",
                x: caster.x,
                y: caster.y,
                color: "rgba(45, 180, 0,0.5)",
                radius: 200,
                maxRadius: 200,
                duration: 30
            });
        }
    },
];

// 이미지 사전 로딩
const loadedImages = {};
SPECIAL_BALLS.forEach(ball => {
    const img = new Image();
    img.src = ball.image;
    loadedImages[ball.id] = img;
});

let p1Index = 0;
let p2Index = 1;
let playerChoice = null;

let canvas, ctx;
let isRunning = false;
let animationFrameId;

let ballP1, ballP2;
let topBall, bottomBall;
let visualEffects = [];
let damageTexts = [];
let lastTime = 0;

function updateSelectUI() {
    const b1 = SPECIAL_BALLS[p1Index];
    document.getElementById('p1-preview').style.backgroundColor = b1.color;
    document.getElementById('p1-preview').style.backgroundImage = `url(${b1.image})`;
    document.getElementById('p1-name').innerText = b1.name;
    document.getElementById('p1-stats').innerHTML = 
        `체력: ${b1.maxHp} | 속도: ${b1.speed}<br>공격력: ${b1.attackPower} (쿨타임 ${b1.cooldown}초)`;

    const btn1 = document.getElementById('p1-join-btn');
    if (playerChoice === 'p1') {
        btn1.classList.add('joined');
        btn1.innerText = "참여됨 (Player)";
    } else {
        btn1.classList.remove('joined');
        btn1.innerText = "참여 (AI)";
    }

    const b2 = SPECIAL_BALLS[p2Index];
    document.getElementById('p2-preview').style.backgroundColor = b2.color;
    document.getElementById('p2-preview').style.backgroundImage = `url(${b2.image})`;
    document.getElementById('p2-name').innerText = b2.name;
    document.getElementById('p2-stats').innerHTML = 
        `체력: ${b2.maxHp} | 속도: ${b2.speed}<br>공격력: ${b2.attackPower} (쿨타임 ${b2.cooldown}초)`;

    const btn2 = document.getElementById('p2-join-btn');
    if (playerChoice === 'p2') {
        btn2.classList.add('joined');
        btn2.innerText = "참여됨 (Player)";
    } else {
        btn2.classList.remove('joined');
        btn2.innerText = "참여 (AI)";
    }
}

function openInfoModal(player) {
    const ball = player === 'p1' ? SPECIAL_BALLS[p1Index] : SPECIAL_BALLS[p2Index];

    document.getElementById('modalBallImg').style.backgroundColor = ball.color;
    document.getElementById('modalBallImg').style.backgroundImage = `url(${ball.image})`;
    document.getElementById('modalBallTitle').innerText = ball.name;
    document.getElementById('modalHp').innerText = ball.maxHp;
    document.getElementById('modalSpeed').innerText = ball.speed;
    document.getElementById('modalAtk').innerText = ball.attackPower;
    document.getElementById('modalCool').innerText = `${ball.cooldown}초`;
    document.getElementById('modalSkillDesc').innerHTML = ball.description.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');

    document.getElementById('infoModal').classList.add('show');
}

function closeInfoModal() {
    document.getElementById('infoModal').classList.remove('show');
}

function triggerShake(elementId) {
    const el = document.getElementById(elementId);
    el.classList.remove('shake');
    void el.offsetWidth;
    el.classList.add('shake');
}

function changeSelection(player, dir) {
    if (player === 'p1') {
        p1Index = (p1Index + dir + SPECIAL_BALLS.length) % SPECIAL_BALLS.length;
        triggerShake('p1-preview');
    } else {
        p2Index = (p2Index + dir + SPECIAL_BALLS.length) % SPECIAL_BALLS.length;
        triggerShake('p2-preview');
    }
    updateSelectUI();
}

function toggleJoin(player) {
    if (playerChoice === player) {
        playerChoice = null;
    } else {
        playerChoice = player;
    }
    updateSelectUI();
}

function startGame() {
    document.getElementById('selectScreen').style.display = 'none';
    document.getElementById('gameOverOverlay').classList.remove('show');

    canvas = document.getElementById('gameCanvas');
    ctx = canvas.getContext('2d');

    const container = document.getElementById('arenaContainer');
    canvas.width = container.clientWidth;
    canvas.height = container.clientHeight;

    const data1 = SPECIAL_BALLS[p1Index];
    const data2 = SPECIAL_BALLS[p2Index];
    const radius = 24;

    ballP1 = {
        ...data1,
        isAI: playerChoice !== 'p1',
        x: canvas.width * 0.3,
        y: canvas.height * 0.25,
        vx: (Math.random() > 0.5 ? 1 : -1) * data1.speed,
        vy: data1.speed,
        radius: radius,
        currentHp: data1.maxHp,
        coolTimer: 0,
        trail: []
    };

    ballP2 = {
        ...data2,
        isAI: playerChoice !== 'p2',
        x: canvas.width * 0.7,
        y: canvas.height * 0.75,
        vx: (Math.random() > 0.5 ? 1 : -1) * data2.speed,
        vy: -data2.speed,
        radius: radius,
        currentHp: data2.maxHp,
        coolTimer: 0,
        trail: []
    };

    if (playerChoice === 'p1') {
        topBall = ballP2;
        bottomBall = ballP1;
    } else {
        topBall = ballP1;
        bottomBall = ballP2;
    }

    document.getElementById('ui-top-icon').style.backgroundColor = topBall.color;
    document.getElementById('ui-top-icon').style.backgroundImage = `url(${topBall.image})`;
    document.getElementById('ui-top-name').innerText = topBall.name;
    const topTag = document.getElementById('ui-top-tag');
    topTag.innerText = topBall.isAI ? "AI" : "PLAYER";
    topTag.className = topBall.isAI ? "side-tag" : "side-tag player";

    document.getElementById('ui-bottom-icon').style.backgroundColor = bottomBall.color;
    document.getElementById('ui-bottom-icon').style.backgroundImage = `url(${bottomBall.image})`;
    document.getElementById('ui-bottom-name').innerText = bottomBall.name;
    const bottomTag = document.getElementById('ui-bottom-tag');
    bottomTag.innerText = bottomBall.isAI ? "AI" : "PLAYER";
    bottomTag.className = bottomBall.isAI ? "side-tag" : "side-tag player";

    const attackBtn = document.getElementById('playerAttackBtn');
    if (playerChoice !== null) {
        attackBtn.style.display = "block";
    } else {
        attackBtn.style.display = "none";
    }

    visualEffects = [];
    damageTexts = [];
    isRunning = true;
    lastTime = performance.now();

    if (animationFrameId) cancelAnimationFrame(animationFrameId);
    animationFrameId = requestAnimationFrame(gameLoop);
}

function gameLoop(now) {
    if (!isRunning) return;

    const dt = Math.min((now - lastTime) / 1000, 0.1);
    lastTime = now;

    updatePhysics(dt);
    updateSkills(dt);
    render();

    if (ballP1.currentHp <= 0 || ballP2.currentHp <= 0) {
        endGame();
        return;
    }

    animationFrameId = requestAnimationFrame(gameLoop);
}

function updatePhysics(dt) {
    const balls = [ballP1, ballP2];

    balls.forEach(b => {
        b.trail.push({ x: b.x, y: b.y });
        if (b.trail.length > 8) b.trail.shift();

        b.x += b.vx;
        b.y += b.vy;

        if (b.x - b.radius < 0) {
            b.x = b.radius;
            b.vx *= -1;
        } else if (b.x + b.radius > canvas.width) {
            b.x = canvas.width - b.radius;
            b.vx *= -1;
        }

        if (b.y - b.radius < 0) {
            b.y = b.radius;
            b.vy *= -1;
        } else if (b.y + b.radius > canvas.height) {
            b.y = canvas.height - b.radius;
            b.vy *= -1;
        }
    });

    const dx = ballP2.x - ballP1.x;
    const dy = ballP2.y - ballP1.y;
    const dist = Math.hypot(dx, dy);
    const minDist = ballP1.radius + ballP2.radius;

    if (dist < minDist) {
        const overlap = minDist - dist;
        const nx = dx / (dist || 1);
        const ny = dy / (dist || 1);

        ballP1.x -= nx * overlap * 0.5;
        ballP1.y -= ny * overlap * 0.5;
        ballP2.x += nx * overlap * 0.5;
        ballP2.y += ny * overlap * 0.5;

        const kx = ballP1.vx - ballP2.vx;
        const ky = ballP1.vy - ballP2.vy;
        const p = 2 * (nx * kx + ny * ky) / 2;

        ballP1.vx -= p * nx;
        ballP1.vy -= p * ny;
        ballP2.vx += p * nx;
        ballP2.vy += p * ny;

        ballP1.currentHp = Math.max(0, ballP1.currentHp - 2);
        ballP2.currentHp = Math.max(0, ballP2.currentHp - 2);

        addDamageText(ballP1.x, ballP1.y - 20, "-2");
        addDamageText(ballP2.x, ballP2.y - 20, "-2");
    }
}

function updateSkills(dt) {
    ballP1.coolTimer = Math.min(ballP1.cooldown, ballP1.coolTimer + dt);
    ballP2.coolTimer = Math.min(ballP2.cooldown, ballP2.coolTimer + dt);

    if (ballP1.isAI && ballP1.coolTimer >= ballP1.cooldown) {
        triggerSkill(ballP1, ballP2);
    }
    if (ballP2.isAI && ballP2.coolTimer >= ballP2.cooldown) {
        triggerSkill(ballP2, ballP1);
    }

    updateStatusUI();
}

function usePlayerSkill() {
    if (!isRunning) return;
    if (playerChoice === 'p1' && ballP1.coolTimer >= ballP1.cooldown) {
        triggerSkill(ballP1, ballP2);
    } else if (playerChoice === 'p2' && ballP2.coolTimer >= ballP2.cooldown) {
        triggerSkill(ballP2, ballP1);
    }
    updateStatusUI();
}

// 🔊 스킬 발동 시 사운드 재생
function triggerSkill(caster, target) {
    caster.coolTimer = 0;
    target.currentHp = Math.max(0, target.currentHp - caster.attackPower);
    addDamageText(target.x, target.y - 30, `-${caster.attackPower}`, caster.color);

    // soundUrl이 지정되어 있으면 MP3 오디오 재생
    if (caster.soundUrl) {
        const audio = new Audio(caster.soundUrl);
        audio.volume = 0.5; // 소리 크기 설정 (0.0 ~ 1.0)
        audio.play().catch(e => console.log("사운드 재생 오류:", e));
    }

    if (caster.onSkillUse) {
        caster.onSkillUse(caster, target, (effect) => {
            visualEffects.push(effect);
        });
    }
}

function addDamageText(x, y, text, color = "#ff3b30") {
    damageTexts.push({
        x, y, text, color,
        life: 1.0
    });
}

function updateStatusUI() {
    const topHpPct = (topBall.currentHp / topBall.maxHp) * 100;
    const topCoolPct = (topBall.coolTimer / topBall.cooldown) * 100;
    document.getElementById('ui-top-hp-bar').style.width = `${topHpPct}%`;
    document.getElementById('ui-top-hp-text').innerText = `${Math.ceil(topBall.currentHp)} / ${topBall.maxHp}`;
    document.getElementById('ui-top-cool-bar').style.width = `${topCoolPct}%`;

    const bottomHpPct = (bottomBall.currentHp / bottomBall.maxHp) * 100;
    const bottomCoolPct = (bottomBall.coolTimer / bottomBall.cooldown) * 100;
    document.getElementById('ui-bottom-hp-bar').style.width = `${bottomHpPct}%`;
    document.getElementById('ui-bottom-hp-text').innerText = `${Math.ceil(bottomBall.currentHp)} / ${bottomBall.maxHp}`;
    document.getElementById('ui-bottom-cool-bar').style.width = `${bottomCoolPct}%`;

    if (playerChoice !== null) {
        const myBall = playerChoice === 'p1' ? ballP1 : ballP2;
        const attackBtn = document.getElementById('playerAttackBtn');
        if (myBall.coolTimer >= myBall.cooldown) {
            attackBtn.classList.add('ready');
            attackBtn.innerText = "ATTACK! (스킬 발사)";
        } else {
            attackBtn.classList.remove('ready');
            attackBtn.innerText = `COOLING (${(myBall.cooldown - myBall.coolTimer).toFixed(1)}s)`;
        }
    }
}

function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    [ballP1, ballP2].forEach(b => {
        b.trail.forEach((t, idx) => {
            ctx.beginPath();
            ctx.arc(t.x, t.y, b.radius * (idx / b.trail.length), 0, Math.PI * 2);
            ctx.fillStyle = b.color;
            ctx.globalAlpha = (idx / b.trail.length) * 0.3;
            ctx.fill();
            ctx.globalAlpha = 1.0;
        });
    });

    for (let i = visualEffects.length - 1; i >= 0; i--) {
        const fx = visualEffects[i];
        ctx.save();

        if (fx.type === "explosion" || fx.type === "wave") {
            ctx.beginPath();
            ctx.arc(fx.x, fx.y, fx.radius, 0, Math.PI * 2);
            ctx.fillStyle = fx.color;
            ctx.fill();
            fx.radius += (fx.maxRadius - fx.radius) * 0.15;
        } else if (fx.type === "lightning") {
            ctx.beginPath();
            ctx.moveTo(fx.x1, fx.y1);
            const midX = (fx.x1 + fx.x2) / 2 + (Math.random() - 0.5) * 40;
            const midY = (fx.y1 + fx.y2) / 2 + (Math.random() - 0.5) * 40;
            ctx.lineTo(midX, midY);
            ctx.lineTo(fx.x2, fx.y2);
            ctx.strokeStyle = fx.color;
            ctx.lineWidth = 6;
            ctx.stroke();
        } else if (fx.type === "beam") {
            ctx.beginPath();
            ctx.moveTo(fx.x1, fx.y1);
            ctx.lineTo(fx.x2, fx.y2);
            ctx.strokeStyle = fx.color;
            ctx.lineWidth = fx.width;
            ctx.lineCap = "round";
            ctx.stroke();
        }

        ctx.restore();
        fx.duration--;
        if (fx.duration <= 0) visualEffects.splice(i, 1);
    }

    [ballP1, ballP2].forEach(b => {
        ctx.save();
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
        ctx.fillStyle = b.color;
        ctx.shadowColor = b.color;
        ctx.shadowBlur = 12;
        ctx.fill();

        ctx.lineWidth = 3;
        ctx.strokeStyle = "#ffffff";
        ctx.stroke();

        const img = loadedImages[b.id];
        if (img && img.complete) {
            ctx.clip();
            const imgSize = b.radius * 1.6;
            ctx.drawImage(img, b.x - imgSize / 2, b.y - imgSize / 2, imgSize, imgSize);
        }

        ctx.restore();
    });

    for (let i = damageTexts.length - 1; i >= 0; i--) {
        const dt = damageTexts[i];
        ctx.save();
        ctx.font = "900 18px sans-serif";
        ctx.fillStyle = dt.color;
        ctx.textAlign = "center";
        ctx.globalAlpha = dt.life;
        ctx.fillText(dt.text, dt.x, dt.y);
        ctx.restore();

        dt.y -= 0.8;
        dt.life -= 0.02;
        if (dt.life <= 0) damageTexts.splice(i, 1);
    }
}

function endGame() {
    isRunning = false;
    const winnerText = document.getElementById('winnerText');
    
    if (ballP1.currentHp <= 0 && ballP2.currentHp <= 0) {
        winnerText.innerText = "무승부!";
    } else if (ballP1.currentHp <= 0) {
        const name = ballP2.name;
        const side = playerChoice === 'p2' ? 'Player' : 'AI';
        winnerText.innerText = `🎉 ${name} (${side}) 승리! 🎉`;
    } else {
        const name = ballP1.name;
        const side = playerChoice === 'p1' ? 'Player' : 'AI';
        winnerText.innerText = `🎉 ${name} (${side}) 승리! 🎉`;
    }

    document.getElementById('gameOverOverlay').classList.add('show');
}

function resetToSelect() {
    document.getElementById('gameOverOverlay').classList.remove('show');
    document.getElementById('selectScreen').style.display = 'flex';
}

updateSelectUI();
</script>
